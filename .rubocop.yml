AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    - "pkg/**/*"

# Specs are naturally long and use descriptive blocks; rake task DSL files use a
# single long namespace block by design (same rationale as the Rakefile).
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"
    - "Rakefile"
    - "**/*.rake"

Metrics/MethodLength:
  Max: 20

# Documentation is provided at the spec level, not per-constant.
Style/Documentation:
  Enabled: false

# The gem uses double quotes consistently.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120
